[workspace]
resolver = "2"
members = ["src-tauri", "crates/proto", "crates/harness", "crates/store", "crates/engine", "crates/git"]

[workspace.dependencies]
hive-proto = { path = "crates/proto" }
hive-harness = { path = "crates/harness" }
hive-store = { path = "crates/store" }
hive-engine = { path = "crates/engine" }
hive-git = { path = "crates/git" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2"
base64 = "0.22"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
uuid = { version = "1", features = ["v4"] }
