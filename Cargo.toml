[workspace]
resolver = "3"
members = ["src-tauri", "crates/proto", "crates/harness", "crates/store", "crates/engine", "crates/mcp"]

[workspace.dependencies]
outcode-proto = { path = "crates/proto" }
outcode-harness = { path = "crates/harness" }
outcode-store = { path = "crates/store" }
outcode-engine = { path = "crates/engine" }
outcode-mcp = { path = "crates/mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
