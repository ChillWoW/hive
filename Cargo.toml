[workspace]
resolver = "2"
members = ["src-tauri", "crates/proto", "crates/harness"]

[workspace.dependencies]
hive-proto = { path = "crates/proto" }
hive-harness = { path = "crates/harness" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
