[package]
name = "app"
version = "0.1.1"
description = "Outcode desktop app"
authors = ["ChillWoW"]
license = "GPL-3.0-only"
repository = "https://github.com/ChillWoW/hive"
edition = "2024"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Picks the newest release for the pre-release update channel.
semver = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
fontdb = "0.24.0"
outcode-proto.workspace = true
outcode-harness.workspace = true
outcode-store.workspace = true
outcode-engine.workspace = true
outcode-mcp.workspace = true
outcode-git.workspace = true
outcode-terminal.workspace = true
base64 = "0.22"
# Walks a chat folder the way git sees it, for the `@` menu.
ignore = "0.4"
# Deleting from the file panel goes to the system's trash.
trash = "5"
tokio = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
