[package]
name = "app"
version = "0.0.1"
description = "Hive desktop app"
authors = ["ChillWoW"]
license = "GPL-3.0-only"
repository = "https://github.com/ChillWoW/hive"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
hive-engine.workspace = true
hive-git.workspace = true
hive-harness.workspace = true
hive-proto.workspace = true
hive-store.workspace = true
tokio = { workspace = true }
serde_json = "1.0"
base64 = "0.22"
ignore = "0.4"
sha2 = "0.10"
uuid.workspace = true
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
portable-pty = "0.9"
